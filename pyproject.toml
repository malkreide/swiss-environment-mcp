[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-environment-mcp"
version = "0.6.0"
description = "MCP Server für Schweizer Umweltdaten des BAFU – Luft, Wasser, Naturgefahren und Umweltindikatoren"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mcp", "bafu", "umwelt", "switzerland", "open-data", "air-quality", "hydrology", "noise", "bazl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    # Major-Version gepinnt: legt die ausgehandelte MCP-Protokoll-Version fest
    # (Audit ARCH-012). Updates kommen via Dependabot.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    # Exakter Pin, und die einzige Stelle, an der die ruff-Version steht. Als
    # hier eine Spanne stand, loeste `pip install -e ".[dev]"` auf die jeweils
    # neueste Version auf (gemessen: 0.16.3), waehrend die CI ihre eigene
    # darueber installierte — ein lokaler Gate-Lauf meldete also Abweichungen,
    # die niemand verursacht hat. Diese Zeile hochzuziehen ist eine bewusste
    # Entscheidung: ein neues ruff kann Regelsatz oder Formatierer aendern und
    # unberuehrten Code rot machen. `test_dependencies.py` faellt, wenn hier
    # wieder eine Spanne steht oder ein Workflow eine zweite Version setzt.
    "ruff==0.16.3",
]
# OpenTelemetry-Tracing (Audit OBS-006), opt-in: pip install '.[otel]'
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
]

[project.urls]
Homepage = "https://github.com/malkreide/swiss-environment-mcp"
Repository = "https://github.com/malkreide/swiss-environment-mcp"

[project.scripts]
swiss-environment-mcp = "swiss_environment_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_environment_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: Test trifft echte BAFU-Live-APIs (Netzwerk nötig). CI: 'pytest -m \"not live\"'.",
]

[tool.ruff.lint.per-file-ignores]
"src/swiss_environment_mcp/server.py" = ["E501"]
# Dieser Test nimmt src/ zur Laufzeit in sys.path auf und muss deshalb nach
# dieser Zeile importieren. E402 laesst sich hier nicht aufloesen, ohne den
# Import zu brechen.
"tests/test_integration.py" = ["E402"]
