services:
  - type: web
    name: swiss-environment-mcp
    runtime: python
    # Plan 'starter' deckelt die Resources hart auf 512 MB RAM / 0.5 vCPU
    # (Audit SCALE-006). Render startet den Dienst bei OOM automatisch neu.
    # Der Server ist single-instance und hält keinen wachsenden State — ein
    # OOM-Kill ist damit ein sauberer Neustart. Details: docs/scaling.md.
    plan: starter
    # Inkl. otel-Extra, damit Tracing aktivierbar ist (Audit OBS-006).
    buildCommand: pip install -e ".[otel]"
    startCommand: python -m swiss_environment_mcp.server
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      # MCP_HOST=0.0.0.0 ist auf Render zwingend, damit der Dienst erreichbar
      # ist (Code-Default ist 127.0.0.1 — Audit SEC-016).
      - key: MCP_HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      # OpenTelemetry-Tracing (Audit OBS-006). Der Dienstname ist gesetzt; der
      # Export-Endpoint wird vom Betreiber im Render-Dashboard hinterlegt
      # (sync:false). Solange er leer ist, bleibt Tracing ein No-op.
      - key: OTEL_SERVICE_NAME
        value: swiss-environment-mcp
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
    healthCheckPath: /health
