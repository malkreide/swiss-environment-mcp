name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev,otel]" --system

      - name: Linting mit ruff
        run: ruff check src/

      - name: Syntax-Prüfung
        run: python -m py_compile src/swiss_environment_mcp/server.py src/swiss_environment_mcp/api_client.py

      - name: Import-Test
        run: python -c "from swiss_environment_mcp.server import mcp; print('Import OK')"

      - name: Tool-Snapshot-Check (Rug-Pull-Schutz, SEC-022)
        run: python scripts/tool_snapshot.py check
        env:
          PYTHONPATH: src

      - name: Unit-Tests (gemockt, ohne Netzwerk)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src
        timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install ruff

      - run: ruff check src/

      - run: ruff format --check src/

      # Nur Standardbibliothek (tomllib ab 3.11) — kein Projekt-Install nötig.
      - name: Versions-Sync server.json ↔ pyproject.toml
        run: python scripts/check_version_sync.py
