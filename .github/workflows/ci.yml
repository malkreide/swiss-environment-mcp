name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        # Installiert den ruff-Pin aus dem [dev]-Extra. Hier stand danach ein
        # zweiter `pip install ruff==<version>`-Schritt, der gegen pyproject
        # gewann: den Pin dort zu aendern haette in der CI nichts bewirkt. Die
        # Version steht nur noch in pyproject, damit lokaler Lauf und CI sich
        # nicht ueber sie uneinig sein koennen.
        run: uv pip install -e ".[dev,otel]" --system

      - name: Linting mit ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax-Prüfung
        run: python -m py_compile src/swiss_environment_mcp/server.py src/swiss_environment_mcp/api_client.py

      - name: Import-Test
        run: python -c "from swiss_environment_mcp.server import mcp; print('Import OK')"

      - name: Tool-Snapshot-Check (Rug-Pull-Schutz, SEC-022)
        run: python scripts/tool_snapshot.py check
        env:
          PYTHONPATH: src

      - name: Unit-Tests (gemockt, ohne Netzwerk)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src
        timeout-minutes: 5

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Holt ruff aus dem [dev]-Extra, wo seine Version als einziges steht.
      # Hier stand `pip install ruff==<version>`: eine zweite Fassung derselben
      # Zahl, die still gegen pyproject gewann.
      - name: ruff aus dem [dev]-Extra installieren
        run: pip install -e ".[dev]"

      - run: ruff check src/ tests/ scripts/

      - run: ruff format --check src/ tests/ scripts/

      # Braucht nur die Standardbibliothek (tomllib ab 3.11); laeuft hier
      # trotzdem nach dem Install, weil ruff ihn ohnehin verlangt.
      - name: Versions-Sync server.json ↔ pyproject.toml
        run: python scripts/check_version_sync.py
