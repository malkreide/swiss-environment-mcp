name: Publish to PyPI

# Zwei Wege:
#
# - `release: published` — der normale Weg: Build → PyPI → MCP Registry.
# - `workflow_dispatch` — NUR der Registry-Job, für eine Version, die schon auf
#   PyPI liegt. Gedacht zum Nachreichen eines Registry-Eintrags, wenn der
#   Registry-Schritt eines Releases nicht das Richtige veröffentlicht hat.
#   Läuft nur auf `main`; Build und PyPI werden übersprungen.
#
# Die Version kommt in beiden Wegen aus `pyproject.toml`, geprüft von
# `scripts/release_version.py` — nicht mehr aus dem Tag-Namen. Bis v0.7.1 stand
# hier `${GITHUB_REF_NAME#v}`; der Tag `V0.7.1` ergab damit einen
# Registry-Eintrag `V0.7.1`, den die Registry nie als «latest» markierte.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Pflicht für Trusted Publisher

jobs:
  build:
    name: Build distribution
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Vor dem Build: Ein Tag, der nicht zu pyproject.toml passt, bricht hier
      # ab — bevor PyPI oder die Registry etwas bekommen.
      - name: Tag gegen pyproject.toml prüfen
        run: python scripts/release_version.py --tag "$GITHUB_REF_NAME"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swiss-environment-mcp/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    # Beim Release: nur nach erfolgreichem PyPI-Upload. Manuell: `publish` ist
    # dann übersprungen, und genau das ist der einzige zulässige Zustand.
    if: >-
      !cancelled() && (
        (github.event_name == 'release' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Version bestimmen
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="$(python3 scripts/release_version.py --tag "$GITHUB_REF_NAME")"
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manuell nur von main aus — gestartet auf $GITHUB_REF."
              exit 1
            fi
            VERSION="$(python3 scripts/release_version.py)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Ein Registry-Eintrag darf nicht auf ein Paket zeigen, das es nicht gibt.
      # Beim Release ist das durch den PyPI-Job davor gesichert, manuell nicht.
      - name: Version muss auf PyPI liegen (nur manuell)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/swiss-environment-mcp/$VERSION/json")"
          if [ "$code" != "200" ]; then
            echo "::error::swiss-environment-mcp $VERSION liegt nicht auf PyPI (HTTP $code)."
            exit 1
          fi

      - name: Sync server.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
