# Merge-Gate: Erst mergen, wenn Codex diesen Head geprueft hat.
#
# WOGEGEN DAS GEBAUT IST
# ----------------------
# Am 28.8.2026 lagen bei drei PRs zwischen «ready for review» und Merge drei
# bis vier Sekunden; `get_reviews` und `get_comments` kamen bei allen dreien
# leer zurueck. Codex wird beim Umschalten von Draft auf ready ausgeloest und
# braucht danach Zeit — wer sofort mergt, hat das Haekchen im PR-Template
# gesetzt und den Review nicht abgewartet. Dasselbe steht fuer den 21./22.8.
# schon in CLAUDE.md.
#
# DIE WARTEZEIT IST EINE FOLGE, KEINE EINSTELLUNG
# -----------------------------------------------
# Ein Gate, das nach N Minuten von selbst gruen wird, behauptet eine Pruefung,
# die es nicht gesehen hat. Am 21./22.8. war das Kontingent ueber eine Spanne
# von mindestens 25 h weg; ein Timer waere durchgelaufen und haette 75
# ungeprueften PRs ein gruenes Haekchen gegeben. Deshalb wartet dieser Job auf
# ein *Signal*, nicht auf eine Uhr: Solange keins da ist, bleibt der Status rot,
# und der Merge steht. `POLL_MAX_SECONDS` begrenzt nur, wie lange ein einzelner
# Lauf pollt — nicht, ab wann gemergt werden darf.
#
# WARUM COMMIT-STATUS UND NICHT DER CHECK-RUN DES JOBS
# ----------------------------------------------------
# Der Job laeuft auch auf `issue_comment`, damit ein spaeter eintreffender
# Codex-Kommentar den Status sofort nachzieht. Bei diesem Event ist `github.sha`
# aber der Head des Default-Branch, nicht der des PR — ein Check-Run daraus
# haenge am falschen Commit (und faerbte `main` rot). Ein Commit-Status laesst
# sich dagegen ausdruecklich auf den PR-Head richten. Deshalb traegt der Status
# das Urteil, und der Job endet immer mit 0.
#
# DER CHECK-RUN DIESES JOBS IST NICHT DAS GATE
# --------------------------------------------
# Folgt aus dem Absatz darueber, wird aber in der Checkliste des PR nicht
# sichtbar — deshalb hier ausgeschrieben. Weil der Job das Urteil NICHT traegt
# und immer mit 0 endet, sagt sein Check-Run nichts ueber Codex aus. Er hiess
# trotzdem «Codex hat diesen Head geprueft», und damit log er in beide
# Richtungen:
#
#   * GRUEN, obwohl nichts geprueft wurde. Gemessen an PR #116 (18.9.2026):
#     Um 10:23:49 stand der Job auf `success`, waehrend `codex-gate` in
#     derselben Minute `pending` meldete — «PR ist ein Draft, Codex laeuft
#     darauf nicht an». Die Checkliste behauptete eine Pruefung, die der Status
#     ausdruecklich verneinte. Genau die Luege, gegen die dieser Workflow
#     gebaut ist, nur eine Zeile tiefer.
#   * ABGEBROCHEN, obwohl alles in Ordnung ist. Unter `cancel-in-progress:
#     true` — so stand es bis 18.9.2026 — raeumte jedes neue Signal den
#     laufenden Poll ab, und unter dem alten Namen las sich das als
#     gescheiterte Pruefung. Zur Umstellung auf `false` unten mehr.
#
# Hier stand, ein abgebrochener Run setze ausserdem `mergeable_state` auf
# `unstable`. Das war geschlossen, nicht gemessen, und die Messung hat es
# widerlegt: PR #117 stand am 18.9.2026 auf `unstable` mit sechs gruenen Runs
# und KEINEM abgebrochenen — waehrend `codex-gate` als Draft auf `pending`
# stand. Ein pendender Commit-Status genuegt also allein. Auf #116 lag beides
# gleichzeitig vor; der Fall taugt deshalb als Beleg fuer keine der beiden
# Richtungen. Fuer den ANDEREN Zustand liegt die Messung seit dem 19.9.2026 vor:
# Auf #118 ging genau eine Groesse von `cancelled` auf `success`, und
# `mergeable_state` kippte von `blocked` auf `clean`. Ein abgebrochener
# Check-Run blockiert also, SOFERN er selbst required ist — und genau dieser
# Job ist es hier, siehe unten. Ueber `unstable` sagt auch das nichts.
#
# Der Job heisst deshalb nach dem, was er TUT — einen Status setzen —, nicht
# nach dem, was Codex getan haben soll. Das Urteil steht im Commit-Status
# `codex-gate` und nirgends sonst.
#
# Zu den Abbruechen selbst stand hier, sie seien unvermeidbar: `false`
# verschiebe das nur vom laufenden auf den wartenden Lauf. Das war falsch, und
# ein Codex-Review auf PR #117 hat es aufgedeckt (P2, 18.9.2026). GitHub raeumt
# einen WARTENDEN Lauf erst ab, wenn ein weiterer derselben Gruppe dazukommt —
# bei `false` braucht ein Abbruch also DREI ueberlappende Laeufe, bei `true`
# genuegen zwei. Der beobachtete Fall auf #116 waren genau zwei
# (`ready_for_review` plus der «Running»-Kommentar); mit `false` waere dort
# nichts abgebrochen worden.
#
# ABER `false` WIRKT NICHT DORT, WO ES STEHT. Am 18.9.2026 lag `false` bereits
# im PR, und der Lauf von #118 wurde trotzdem abgeraeumt (17:02:50 gestartet,
# 17:04:06 `cancelled`). Grund ist eine Versionsschere: Bei `pull_request` nimmt
# GitHub diese Datei aus dem PR, bei `issue_comment` und `pull_request_review`
# aus dem DEFAULT-BRANCH. Dort stand noch `true`, und der Kommentar-Lauf mit der
# alten Fassung toetete den PR-Lauf mit der neuen — die Concurrency-Gruppe
# verbindet die Fassungen, sie trennt sie nicht. Eine Aenderung hier ist also
# erst nach dem Merge ganz scharf; wer sie am PR prueft, prueft eine Haelfte.
# Ein so getoeteter Lauf darf erneut gestartet werden: Er ist an einer Kollision
# gestorben, nicht an einem Befund.
#
# Zwei Messungen haben den Rest der Begruendung ebenfalls gekippt:
#
#   * Die Schleife unten liest `pr.head.sha` in JEDER Iteration neu. Ein
#     laufender Poll folgt einem neuen Push also von selbst; er haengt nicht am
#     Head, mit dem er gestartet ist. Der Grund, einen Lauf beim Push zu
#     toeten, faellt damit weg.
#   * Sie bricht ab, sobald ein Urteil feststeht (`state !== 'pending'`). Ein
#     Lauf sitzt das Fenster also nur ab, wenn wirklich kein Signal kommt — ein
#     wartender Lauf wird in der Regel binnen Sekunden frei.
#
# `false` erreicht «je PR nur ein Lauf» damit durch Anstehen statt durch
# Toeten, und verhindert die widerspruechliche Ueberschreibung genauso: Zwei
# Laeufe derselben Gruppe laufen nie gleichzeitig.
#
# WAS NOCH FEHLT, DAMIT ES WIRKT
# -------------------------------
# Dieser Workflow allein haelt nichts auf. Der Kontext `codex-gate` muss in den
# Repo-Einstellungen als *required status check* auf `main` stehen, inklusive
# «Do not allow bypassing the above settings» — sonst bleibt der Merge-Button
# klickbar und das Gate ist Dekoration. Stand 28.8.2026 war `main` in beiden
# Repos ungeschuetzt (`protected: false`), es gab also ueberhaupt keinen
# Required Check.

name: Codex-Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft]
  # Codex meldet sich als gewoehnlicher Issue-Kommentar (Kontingent-,
  # Environment-Meldung, frueher auch die Befundlos-Meldung), als
  # fortgeschriebene Summary-Tabelle oder als Review-Objekt. Alle Wege muessen
  # den Status nachziehen koennen.
  #
  # `edited` ist seit dem 29.8.2026 kein Luxus: Die Summary wechselt von
  # «Running» auf «Completed», indem Codex DENSELBEN Kommentar bearbeitet. Mit
  # `created` allein kaeme dieses Signal nie an — der Poll-Lauf unten faengt es
  # nur, solange sein Zeitfenster laeuft, und danach haenge das Gate auf
  # `pending`, obwohl der Review fertig ist.
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  # `checks: read` fuer `listSuitesForRef`, das den Frische-Anker liefert.
  # Ein expliziter `permissions`-Block setzt JEDEN nicht genannten Scope auf
  # `none` — ohne diese Zeile antwortet der Endpunkt mit 403 (dritter
  # Codex-Review, 28.8.2026). Der Fehler war unsichtbar, weil der `catch`
  # unten ihn schluckte und die Frische still auf das Committer-Datum
  # zurueckfiel, also in genau die Luecke, die der Anker schliessen soll.
  checks: read

concurrency:
  # Je PR nur ein Lauf: Ein zweiter wuerde denselben Status widerspruechlich
  # ueberschreiben, je nachdem welcher zuerst fertig wird.
  group: codex-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  # Anstehen statt toeten. Das schliesst die Gleichzeitigkeit genauso aus, laesst
  # aber einen Poll zu Ende laufen, der das Signal ohnehin gleich sieht — und
  # hinterlaesst im Zwei-Lauf-Fall keinen abgebrochenen Check-Run, SOBALD diese
  # Fassung auf dem Default-Branch liegt. Vorher gilt fuer Kommentar-Ereignisse
  # noch die alte. Begruendung samt Messungen im Kopf unter «Zu den Abbruechen
  # selbst».
  cancel-in-progress: false

jobs:
  gate:
    # Nach der Taetigkeit benannt, nicht nach dem Urteil: Dieser Job endet
    # immer mit 0, sein Check-Run sagt also nichts ueber Codex. Begruendung
    # oben unter «DER CHECK-RUN DIESES JOBS IST NICHT DAS GATE».
    #
    # Aendert jemand diesen Namen, aendert sich der Name des Check-Runs. Der
    # Required Check ist der Commit-Status `codex-gate` und bleibt davon
    # unberuehrt — steht in der Branch Protection dagegen der Check-Run-Name,
    # ist er dort mitzuziehen.
    # In Anfuehrungszeichen: Ein unquotierter YAML-Skalar mit «: » darin
    # ist ein Syntaxfehler, und GitHub meldete ihn erst beim Lauf.
    name: "codex-gate: Status setzen"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `issue_comment` feuert auch auf echte Issues — dort gibt es keinen Head,
    # den man pruefen koennte.
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Pollen, bis Codex gesprochen hat
        id: gate
        uses: actions/github-script@v9
        env:
          POLL_MAX_SECONDS: "900"
          POLL_INTERVAL_SECONDS: "30"
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');

            const number = context.payload.pull_request?.number
                        ?? context.payload.issue?.number;
            const maxMs = Number(process.env.POLL_MAX_SECONDS) * 1000;
            const stepMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
            const deadline = Date.now() + maxMs;

            // Der Status wird sofort auf `pending` gesetzt: Ein Gate, das erst
            // am Ende des Laufs auftaucht, laesst genau das Fenster offen, das
            // es schliessen soll.
            const setStatus = async (sha, state, description) => {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha, state, context: 'codex-gate',
                description: description.slice(0, 140),
              });
            };

            let last = { state: 'pending', reason: 'Lauf gestartet' };
            let sha = null;
            // SHA -> Zeitpunkt, zu dem GitHub den Commit erstmals gesehen hat.
            // Quelle sind die Check-Suites auf diesem SHA: GitHub legt sie beim
            // Push an, unabhaengig von jedem Lauf von uns.
            //
            // Die Laufzeit dieses Jobs taugt dafuer NICHT (zweiter
            // Codex-Review, 28.8.2026, P1). Ein `issue_comment`-Lauf startet
            // zwangslaeufig NACH dem Kommentar, der ihn ausgeloest hat. Ist er
            // der erste, der hier ankommt — der `synchronize`-Lauf kann
            // ausgefallen sein —, laege der Anker hinter dem einzigen
            // gueltigen Signal, und das Gate haenge dauerhaft auf `pending`.
            // Ein Dauerstall ist schlimmer als die Luecke, die der Anker
            // schliesst.
            //
            // Als das geschrieben wurde, machte das eigene
            // `cancel-in-progress: true` genau diesen Ausfall wahrscheinlich.
            // Seit dem 18.9.2026 steht dort `false` (Begruendung im Kopf), der
            // haeufigste Weg in die Luecke ist also zu. Der Anker bleibt
            // trotzdem: Er haengt nicht an dieser Einstellung.
            //
            // Die Check-Suite-Zeit stimmt in beide Richtungen: Ein Kommentar
            // zum VORIGEN Head liegt vor diesem Push und damit vor der Suite;
            // ein Kommentar zu DIESEM Head kann es erst danach geben.
            const seenCache = new Map();
            // SHAs, fuer die der Abruf FEHLGESCHLAGEN ist — nicht solche
            // ohne Check-Suite. Nur ein Defekt gehoert in die Meldung.
            const seenUnavailable = new Set();

            const headSeenAt = async (commit) => {
              if (seenCache.has(commit)) return seenCache.get(commit);
              let seen = null;
              try {
                const { data } = await github.rest.checks.listSuitesForRef({
                  ...context.repo, ref: commit, per_page: 100,
                });
                const times = (data.check_suites || [])
                  .map((cs) => cs.created_at)
                  .filter(Boolean)
                  .sort();
                seen = times[0] ?? null;
              } catch (e) {
                // Nicht mehr bloss `warning`: Ein geschluckter 403 sieht aus
                // wie ein gesunder Lauf, und genau daran ist die fehlende
                // `checks: read`-Permission unbemerkt geblieben. Der Vermerk
                // geht zusaetzlich ins Skript und von dort in den sichtbaren
                // Status — ein Defekt, den nur das Job-Log kennt, ist keiner,
                // den jemand findet.
                core.error(`Check-Suites fuer ${commit} nicht lesbar: ${e.message}`);
                seenUnavailable.add(commit);
              }
              // Kein Rueckfall auf `now`: lieber ohne Beobachtung weiter (dann
              // greift im Skript das Committer-Datum) als mit einer Zahl, die
              // nur sagt, wann dieser Job lief.
              seenCache.set(commit, seen);
              return seen;
            };

            while (true) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: number,
              });
              sha = pr.head.sha;
              const { data: headCommit } = await github.rest.repos.getCommit({
                ...context.repo, ref: sha,
              });
              const [reviews, comments] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  ...context.repo, pull_number: number, per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  ...context.repo, issue_number: number, per_page: 100,
                }),
              ]);

              // Fremdtext (Kommentar-Bodies) geht ueber eine Datei ins Skript,
              // nicht ueber die Kommandozeile oder ein Template-Literal.
              const payload = {
                draft: pr.draft,
                head_sha: sha,
                head_committed_at: headCommit.commit.committer.date,
                head_seen_at: await headSeenAt(sha),
                head_seen_unavailable: seenUnavailable.has(sha),
                reviews: reviews.map((r) => ({
                  user: { login: r.user?.login }, commit_id: r.commit_id, state: r.state,
                })),
                comments: comments.map((c) => ({
                  user: { login: c.user?.login }, body: c.body, created_at: c.created_at,
                })),
              };
              fs.writeFileSync('codex-payload.json', JSON.stringify(payload));

              const out = execFileSync('python', [
                'scripts/classify_codex_review.py', '--payload', 'codex-payload.json',
              ], { encoding: 'utf-8' });
              const state = /^state=(.*)$/m.exec(out)?.[1] ?? 'pending';
              const status = /^status=(.*)$/m.exec(out)?.[1] ?? 'pending';
              const reason = /^reason=(.*)$/m.exec(out)?.[1] ?? '';
              last = { state, reason };
              core.info(`${state} -> ${status}: ${reason}`);

              // Welcher Status zu welchem Befund gehoert, entscheidet das
              // Skript (COMMIT_STATUS) — dort steht es neben seinem Test.
              await setStatus(sha, status, reason);

              // `reviewed`, `blocked` und `draft` aendern sich nicht durchs
              // Warten: Der erste ist fertig, die beiden anderen brauchen eine
              // Handlung. Nur `pending` ist ein Zustand, aus dem Pollen
              // herausfuehrt.
              if (state !== 'pending') break;
              if (Date.now() + stepMs > deadline) {
                // Bleibt `pending`, nicht `failure`: Dass dieser Lauf sein
                // Zeitfenster ausgeschoepft hat, sagt nichts darueber, ob
                // Codex noch antwortet — der `issue_comment`-Trigger zieht den
                // Status nach. Der Merge bleibt so oder so blockiert.
                await setStatus(sha, 'pending',
                  `${reason} — Zeitfenster dieses Laufs abgelaufen`);
                break;
              }
              await new Promise((r) => setTimeout(r, stepMs));
            }

            await core.summary
              .addHeading('Codex-Gate')
              .addRaw(`**${last.state}** — ${last.reason}`)
              .write();

            // Bewusst kein Fehler: Das Urteil traegt der Commit-Status auf dem
            // PR-Head. Ein rot beendeter Job wuerde bei `issue_comment` ein
            // rotes Kreuz an den Default-Branch haengen.
